set-environment -gu __HM_SESS_VARS_SOURCED

unbind C-b 
set-option -g prefix C-a 
bind-key C-a send-prefix 

unbind '"' 
unbind %

bind r source-file ~/.tmux.conf 

#bind -n M-Left select-pane -L 
#bind -n M-Right select-pane -R 
#bind -n M-Up select-pane -U
#bind -n M-Down select-pane -D 
#bind -n M-h split-window -h 
#bind -n M-v split-window -v 

bind | split-window -h 
bind - split-window -v 
bind l select-pane -R 
bind k select-pane -U 
bind j select-pane -D 
bind h select-pane -L

set -g visual-activity off                                                                                                             
set -g visual-bell off                                                                                                                 
set -g visual-silence off                                                                                                              
setw -g monitor-activity off                                                                                                           
set -g bell-action none                                                                                                                
                                                                                                                                       
# start windows (and panes ig) start at 1 instead of 0                                                                                 
set -g base-index 1                                                                                                                    
setw -g pane-base-index 1                                                                                                              
                                                                                                                                       
# clock mode                                                                                                                           
setw -g clock-mode-colour yellow                                                                                                       

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=#f7768e'
set -g pane-active-border-style 'fg=#f7768e'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#f7768e'

set -g status-left ''
set -g status-left-style 'fg=#f7768e bg=#262626'
set -g status-left-length 10

set -g status-right-style 'fg=#f7768e bg=#262626'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=#f7768e bg=#262626'
setw -g window-status-current-format ' #I #W . '

setw -g window-status-style 'fg=#f7768e bg=#262626'
setw -g window-status-format ' #I #[fg=#f7768e]#W #[fg=#f7768e]#F ' 

set -g visual-activity off                                                                                                             
set -g visual-bell off                                                                                                                 
set -g visual-silence off                                                                                                              
setw -g monitor-activity off                                                                                                           
set -g bell-action none                                                                                                                
                          
