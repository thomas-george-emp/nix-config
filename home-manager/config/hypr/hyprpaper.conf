preload = ~/.config/hypr/wallpapers/tribe_called_quest.png
preload = ~/.config/hypr/wallpapers/space_wallpaper.png
preload = ~/.config/hypr/wallpapers/saturn_wallpaper.png

wallpaper { 
	monitor = eDP-1
	path = ~/.config/hypr/wallpapers/tribe_called_quest_wallpaper.png
	fit_mode = cover
}

wallpaper { 
	monitor = DP-1
	path = ~/.config/hypr/wallpapers/space_wallpaper.png
	fit_mode = cover
}
wallpaper {
	monitor = HDMI-A-1
	path = ~/.config/hypr/wallpapers/saturn_wallpaper.png
	fit_mode = cover
}

splash=false
